server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:dev-keystore.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-alias: gateway-dev
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: api-gateway

app:
  jwt:
    # Apenas desenvolvimento. Em produção, defina JWT_SECRET no ambiente.
    secret: ${JWT_SECRET:DEV_ONLY_change_this_JWT_secret_32_bytes_minimum_123456}
    issuer: gateway-seguro
    expiration-ms: 900000
  demo:
    user-password: ${DEMO_USER_PASSWORD:usuario123}
    admin-password: ${DEMO_ADMIN_PASSWORD:admin123}
  backend:
    url: http://127.0.0.1:8081/internal/pedidos
    shared-key: ${GATEWAY_SHARED_KEY:DEV_ONLY_change_this_shared_key_for_production_123}
